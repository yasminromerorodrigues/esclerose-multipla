name: Noticias do ano

on:
  schedule:
    - cron: "0 12 * * 1"   # toda segunda-feira, 9h no horário de Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  models: read     # inteligência artificial gratuita do GitHub Models

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ler as notícias da semana
        id: preparar
        run: python3 noticias.py preparar

      - name: Pedir à IA (modelo principal)
        id: ia1
        if: steps.preparar.outputs.tem_noticias == 'sim'
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          system-prompt-file: ${{ runner.temp }}/ia_sistema.txt
          prompt-file: ${{ runner.temp }}/ia_pedido.txt
          max-tokens: 1500

      - name: Pedir à IA (modelo reserva)
        id: ia2
        if: steps.preparar.outputs.tem_noticias == 'sim' && steps.ia1.outcome != 'success'
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          system-prompt-file: ${{ runner.temp }}/ia_sistema.txt
          prompt-file: ${{ runner.temp }}/ia_pedido.txt
          max-tokens: 1500

      - name: Montar a linha do tempo
        env:
          RESPOSTA: ${{ steps.ia1.outputs.response-file || steps.ia2.outputs.response-file }}
        run: python3 noticias.py salvar

      - name: Salvar no site
        run: |
          git config user.name "noticias-bot"
          git config user.email "noticias-bot@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then echo "Nada novo para salvar"; exit 0; fi
          git commit -m "Noticias do ano: atualizacao semanal"
          git pull --rebase
          git push
